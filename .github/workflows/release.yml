name: Release

# Pushing a tag like v2.41.0 builds the addon zip and uploads it
# to GitHub Releases, and to CurseForge once the project is set up
# (X-Curse-Project-ID in the .toc and the secret CF_API_KEY).
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: BigWigsMods/packager@v2
